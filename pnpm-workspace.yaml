packages:
  - apps/*
  - packages/*

# pnpm 11+ reads build approvals from pnpm-workspace.yaml via 'allowBuilds'.
# Only esbuild (required by Vite) is allowed to run install scripts.
allowBuilds:
  '@swc/core': set this to true or false
  edgedriver: set this to true or false
  esbuild: true
  geckodriver: set this to true or false
