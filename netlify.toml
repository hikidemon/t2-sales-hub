# Netlify Configuration for T2 Sales Hub
# This file configures the build and deployment settings for Netlify

[build]
  # Build command for the frontend (Vite + React)
  command = "pnpm --filter @t2-sales-hub/web run build"
  # Output directory for the built files
  publish = "apps/web/dist"
  # Base directory for the build
  base = "apps/web"

[build.environment]
  # Node.js version
  NODE_VERSION = "20"
  # PNPM version
  PNPM_VERSION = "8"
  # Enable pnpm
  PNPM_ENABLE = "true"

[build.processing]
  # Skip processing for SPA (single page application)
  skip_processing = true

[[redirects]]
  # SPA fallback for React Router
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  # API functions directory (if needed for serverless functions)
  directory = "netlify/functions"

[edge_functions]
  # Edge functions directory (if needed)
  directory = "netlify/edge-functions"

# Build plugins
[[plugins]]
  package = "@netlify/plugin-nextjs"
  # Not needed for Vite, but keeping for reference

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Caching for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Build environment variables (set in Netlify dashboard)
# [build.environment]
#   VITE_API_URL = "https://your-api-domain.com/api"
#   NODE_ENV = "production"