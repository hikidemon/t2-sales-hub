# Netlify Configuration for T2 Sales Hub (Monorepo with pnpm)
# Build from repo root with pnpm workspace filter

[build]
  # Build from repo root using pnpm workspace filter
  command = "pnpm --filter @t2-sales-hub/web run build"
  # Output directory relative to repo root
  publish = "apps/web/dist"
  # Base directory is repo root (where pnpm-workspace.yaml lives)
  base = "."

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"
  ENABLE_PNPM = "true"

[build.processing]
  # SPA: no HTML rewriting, React Router handles routing
  skip_processing = true

[[redirects]]
  # SPA fallback for React Router
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"

[edge_functions]
  directory = "netlify/edge-functions"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"